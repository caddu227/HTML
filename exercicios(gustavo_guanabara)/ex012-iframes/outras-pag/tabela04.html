<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercicio de tabela</title>

    <style>

        * {
            padding: 0px;
            margin: 0px;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;

        }
        h1 {
            text-align: center;
            font-size: 2.5em;
            padding: 20px;
            margin-bottom: 30px;
        }

        table {
            width: 500px;
            margin: auto;
            border-collapse: collapse;
        }

        td, th, caption { 
            border: 1px solid black;
            padding: 7px;

        }





    </style>
</head>
<body>

    <h1>Exercício de Tabela</h1>

    <table>
        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Idade</th>
            <th scope="col">Sexo</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td>Ana Maria</td>
            <td>25</td>
            <td>F</td>
            <td>Jornalismo</td>
        </tr>
         <tr>
            <td>Jorge Matheus</td>
            <td>21</td>
            <td>M</td>
            <td>Artista</td>
        </tr>
         <tr>
            <td>João Henrique</td>
            <td>17</td>
            <td>M</td>
            <td>Estudante</td>
        </tr>
         <tr>
            <td>Dolores da Silva</td>
            <td>87</td>
            <td>F</td>
            <td>Aposentada</td>
        </tr>
         <tr>
            <td>Glória alvez</td>
            <td>35</td>
            <td>F</td>
            <td>Advogada</td>
        </tr>
         <tr>
            <td>Pedro bial</td>
            <td>38</td>
            <td>M</td>
            <td>apresentador</td>
            
        </tr>
    </table>
    
    
</body>
</html>

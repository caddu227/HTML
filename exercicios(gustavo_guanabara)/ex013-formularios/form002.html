<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mais formularios</title>
</head>
<body>
    <h1>mais formularios</h1>

    <form action="cadastro.php" method="get">   

        <p>
            <label for="iest">Estado:</label>
            <select name="estado" id="iest">

        
            <optgroup label="Região Sudeste">
                <option value="RJ">Rio de Janeiro</option>
                <option value="SP">São paulo</option>
                <option value="MG">Minas Gerais</option>
            </optgroup>

            <optgroup label="Região Nordeste">
                <option value="MA">Maranhão</option>
                <option value="PE">Pernanbuco</option>
                <option value="RN">Rio grande do Norte</option>
            </optgroup>
            </select>
        </p>

        <p>
            <label for="iprof">Profissão: </label>
            <input type="text" name="profissao" id="iprof" list="iprofissoes">
            <datalist id="iprofissoes">
                <option value="ADM">Administrador</option>
                <option value="CONT">Contabilista</option>
                <option value="DEV">Desenvolvedor</option>
                <option value="PROF">Professor</option>
            </datalist>
        </p>


        <p>
            <label for="imsg">Mensagem</label> <br>
            <textarea name="" id="" cols="30" rows="10"></textarea>
        </p>


        <p>
            <label for="in1">Numero 1</label>
            <input type="number" name="num1" id="in1"
            oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value)">
        
        </p>

        <p>
            <label for="in2">Numero 2</label>
            <input type="number" name="num2" id="in2"
            oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value)">
        </p>

        <p>
            <label for="isoma">soma: </label>
            <output name="soma" id="isoma"></output>
        </p>



        <p>
            <label for="inum">Numero:</label>
            <input type="range" name="num" id="inum" min="0" max="10" value="5" oninput="ival.innerHTML = Number(inum.value)">
            <output id="ival">5</output>

        </p>
    </form>





    <form action="cadastro.php" method="post">
        <p>
            <label for="iano">Em que ano vc nasceu?</label>
            <input type="number" name="ano" id="iano" min="1900" max="2020" oninput="calcidade()">
        </p>
        <p>
            <label for="iidade">sua idade é</label>
            <output id="iidade">0</output>
        </p>
    </form>

    <script>
        function calcidade() {
            let atual = new Date().getFullYear()
            iidade.innerHTML = Number(atual) - Number(iano.value)
        }
    </script>




</body>
</html>

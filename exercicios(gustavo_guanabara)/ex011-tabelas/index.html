<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelas</title>
    <style>

        table {
            width: 400px;
            border-collapse: collapse;
        }
        td, th {
            border: 1px solid black;
            padding: 6px;
        }

        th {
            background-color: rgba(16, 62, 122, 0.589);
        }

        td {
            background-color: rgba(21, 111, 196, 0.74);
        }

        footer {
            margin-top: 100px;
            background-color: rgba(71, 70, 70, 0.281);
            padding: 1px;
        }

        footer a {
            color: rgb(4, 27, 58);
            text-align: center;
            font-weight: bolder;
        }

        footer p {
            text-align: right;
        }
    


    </style>
</head>
<body>

    <h1>minha primeira tabela</h1>

    <table>
        <tr>
            <th>frutas</th>
            <td>acerola</td>
            <td>manga</td>
            <td>goiaba</td>
        </tr>
        <tr>
            <th>cores</th>
            <td>azul</td>
            <td>vermelho</td>
            <td>amarelo</td>
        </tr>
        <tr>
            <th>lugares</th>
            <td>praia</td>
            <td>campo</td>
            <td>cidade</td>
        </tr>


    </table>


    <footer> <p><a href="tabela02.html" target="_blank" >proxima pag ></p> </a> </footer>

    
    
</body>
</html>

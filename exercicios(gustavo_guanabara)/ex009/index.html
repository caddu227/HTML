<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>imegens de fundo </title>
    <style>
        div.quadrado {
            border: 3px solid black ;
            width: 300px;
            height: 300px;
            display: inline-block;

        }


        div#q1 { background-color: antiquewhite;

        }

        div#q2 {
            background-image: linear-gradient(to bottom, yellow, rgb(255, 51, 0) );

        div#q3 {
            background-image: url(imagens/pattern001.png);

        }


    </style>
</head>
<body>

    <div class="quadrado" id="q1"> </div>
    <div class="quadrado" id="q2"> </div>
    <div class="quadrado" id="q3"> </div>
